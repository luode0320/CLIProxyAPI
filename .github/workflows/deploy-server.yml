name: deploy-server

on:
  push:
    branches:
      - main

env:
  TARGET_OS: linux
  TARGET_ARCH: amd64
  IMAGE: luode0320/cli-proxy-api:latest
  IMAGE_TAR: cli-proxy-api.tar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build metadata
        run: |
          echo "VERSION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build image archive
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${TARGET_OS}/${TARGET_ARCH}" \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --output type=docker,dest="${IMAGE_TAR}" \
            --tag "${IMAGE}" \
            .

      - name: Upload image archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: root
          password: ${{ secrets.REGISTRY_PASSWORD }}
          port: 22
          source: cli-proxy-api.tar
          target: /usr/local/src/cli-proxy-api

      - name: Deploy and restart container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: root
          password: ${{ secrets.REGISTRY_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail

            IMAGE="luode0320/cli-proxy-api:latest"
            CONTAINER="cli-proxy-api"
            APP_DIR="/usr/local/src/cli-proxy-api"
            TAR_PATH="${APP_DIR}/cli-proxy-api.tar"
            BACKUP_DIR="${APP_DIR}/archive"
            BACKUP_TAR="${BACKUP_DIR}/cli-proxy-api.tar.$(date +%Y%m%d_%H%M%S)"
            LOG_DIR="${APP_DIR}/log"
            CONFIG_DIR="${APP_DIR}/config"
            PLUGIN_DIR="${APP_DIR}/plugins"
            AUTH_DIR="${APP_DIR}/auths"
            STATIC_DIR="${APP_DIR}/static"
            PGSTORE_DIR="${APP_DIR}/pgstore"
            GITSTORE_DIR="${APP_DIR}/gitstore"
            OBJECTSTORE_DIR="${APP_DIR}/objectstore"

            mkdir -p "${LOG_DIR}"
            mkdir -p "${BACKUP_DIR}"
            mkdir -p "${CONFIG_DIR}"
            mkdir -p "${PLUGIN_DIR}"
            mkdir -p "${AUTH_DIR}"
            mkdir -p "${STATIC_DIR}"
            mkdir -p "${PGSTORE_DIR}"
            mkdir -p "${GITSTORE_DIR}"
            mkdir -p "${OBJECTSTORE_DIR}"

            if [ ! -s "${TAR_PATH}" ]; then
              echo "image archive not found: ${TAR_PATH}"
              exit 1
            fi

            docker load -i "${TAR_PATH}"
            cp "${TAR_PATH}" "${BACKUP_TAR}"
            ls -1t "${BACKUP_DIR}"/cli-proxy-api.tar.* 2>/dev/null | sed -n '4,$p' | xargs -r rm -f

            # The image does not ship a runtime config.yaml. Bootstrap one from
            # the bundled example on first deploy, then keep the mounted copy.
            # Replace the example API keys before relying on the proxy endpoints.
            #
            # Guard: config.yaml must be a regular FILE. If a previous deploy left
            # a DIRECTORY at this path (Docker auto-creates one when a bind-mount
            # source file is missing), the mount would shadow the container's
            # /CLIProxyAPI/config.yaml and break startup.
            if [ -e "${CONFIG_DIR}/config.yaml" ] && [ ! -f "${CONFIG_DIR}/config.yaml" ]; then
              echo "FATAL: ${CONFIG_DIR}/config.yaml exists but is NOT a regular file (likely a directory)."
              echo "Remove it, then re-run this workflow to bootstrap from config.example.yaml."
              exit 1
            fi
            if [ ! -f "${CONFIG_DIR}/config.yaml" ]; then
              echo "No config.yaml found; bootstrapping from config.example.yaml"
              echo "WARNING: example API keys will enable safe mode; edit ${CONFIG_DIR}/config.yaml before use"
              docker run --rm \
                -v "${CONFIG_DIR}":/config \
                --entrypoint cp \
                "${IMAGE}" \
                /CLIProxyAPI/config.example.yaml /config/config.yaml
            fi

            docker rm -f "${CONTAINER}" || true
            # Persistent bind mounts — all survive container recreation:
            #   config.yaml -> /CLIProxyAPI/config.yaml  (FILE, bootstrapped above)
            #   logs        -> /CLIProxyAPI/logs
            #   plugins     -> /CLIProxyAPI/plugins      (plugin binaries; were lost on every deploy)
            #   auths       -> /root/.cli-proxy-api      (auth records / OAuth tokens)
            #   static      -> /CLIProxyAPI/static       (management panel asset)
            #   pgstore     -> /CLIProxyAPI/pgstore      (Postgres store spool; only with PGSTORE_DSN)
            #   gitstore    -> /CLIProxyAPI/gitstore     (Git store local copy; only with GITSTORE_GIT_URL)
            #   objectstore -> /CLIProxyAPI/objectstore  (Object store spool; only with OBJECTSTORE_ENDPOINT)
            docker run -d \
              --network host \
              --restart=always \
              -v /etc/hosts:/etc/hosts \
              -v "${CONFIG_DIR}/config.yaml":/CLIProxyAPI/config.yaml \
              -v "${LOG_DIR}":/CLIProxyAPI/logs \
              -v "${PLUGIN_DIR}":/CLIProxyAPI/plugins \
              -v "${AUTH_DIR}":/root/.cli-proxy-api \
              -v "${STATIC_DIR}":/CLIProxyAPI/static \
              -v "${PGSTORE_DIR}":/CLIProxyAPI/pgstore \
              -v "${GITSTORE_DIR}":/CLIProxyAPI/gitstore \
              -v "${OBJECTSTORE_DIR}":/CLIProxyAPI/objectstore \
              -e APP_ENV=docker \
              --name "${CONTAINER}" \
              "${IMAGE}"
